name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # --- Normal, readable debug build (unchanged behaviour) ---
      - name: Build (debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          # Turn javac errors into annotations so they show up on the run page and in the checks API.
          awk '/\.java:[0-9]+: error: /{ if (msg) print msg; n=4; msg=$0; next } n>0 && msg { msg = msg " | " $0; n--; next } END { if (msg) print msg }' build.log | head -60 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's#^.*/(src/[^:]+\.java):([0-9]+): .*#\1#')
            num=$(echo "$line" | sed -E 's#^.*\.java:([0-9]+): .*#\1#')
            msg=$(echo "$line" | sed -E 's#^.*\.java:[0-9]+: error: ##')
            echo "::error file=$file,line=$num::$msg"
          done
          tail -40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=build tail::/'
          echo

      # Move the readable jars aside so the release build can reuse build/libs.
      - name: Stash debug jars
        run: |
          mkdir -p debug-dist
          cp build/libs/*.jar debug-dist/
          rm -f build/libs/*.jar

      # --- Obfuscated release build ---
      - name: Build (release, obfuscated)
        run: |
          set -o pipefail
          ./gradlew remapJar --no-daemon -Prelease 2>&1 | tee release.log

      # Run the real JVM bytecode verifier over the obfuscated (pre-remap) classes
      # without launching Minecraft. This catches the VerifyError class of bug that
      # crashed the mod at load. Fails the build if any class fails verification.
      - name: Verify bytecode loads (JVM verifier)
        run: |
          set -o pipefail
          ./gradlew printReleaseLibs --no-daemon -Prelease
          NAMED_LIBS="$(cat build/release/libs-classpath.txt)"

          # IMPORTANT: verify the FINAL remapped jar that actually ships - not the
          # pre-remap jar. The remap step recomputes stack-map frames, so a jar can
          # pass verification before remap and still fail at load after it (that is
          # exactly the bug that shipped twice). The shipped classes reference
          # Minecraft by intermediary name (net.minecraft.class_*), so we must put
          # the intermediary Minecraft jar on the classpath or the classes won't even
          # link here - and VerifyClasses now fails if any class cannot link, so a
          # missing classpath can't produce a false "OK".
          SHIPPED=""
          for f in build/libs/loot-client-*.jar; do
            case "$f" in
              *-dev.jar|*-sources.jar) ;;
              *) SHIPPED="$f" ;;
            esac
          done
          echo "Shipped (remapped) jar: $SHIPPED"

          echo "== candidate Minecraft jars in the Loom cache =="
          find "$HOME/.gradle/caches/fabric-loom" -iname '*minecraft*.jar' 2>/dev/null | sort || true
          INT_MC="$(find "$HOME/.gradle/caches/fabric-loom" -iname '*intermediary*.jar' 2>/dev/null | tr '\n' ':')"
          echo "Intermediary Minecraft jar(s): $INT_MC"

          CP="${SHIPPED}:${INT_MC}${NAMED_LIBS}"
          mkdir -p build/verifytool
          javac -d build/verifytool .github/VerifyClasses.java
          java -cp build/verifytool VerifyClasses "$SHIPPED" "$CP"

      # Isolate ONLY the obfuscated, remapped main jar. Loom's `jar` task
      # re-creates a readable `-dev.jar` in build/libs; it must never be
      # shipped, so copy out just the unclassified jar.
      - name: Collect release jar
        run: |
          mkdir -p release-dist
          for f in build/libs/loot-client-*.jar; do
            case "$f" in
              *-dev.jar|*-sources.jar) ;;      # skip readable jars
              *) cp "$f" release-dist/ ;;
            esac
          done
          cp build/release/mapping.txt release-dist/ 2>/dev/null || true
          echo "Release dist contents:"; ls -l release-dist/

      - name: Verify obfuscation
        run: |
          chmod +x .github/verify-obfuscation.sh
          RELEASE_JAR=$(ls release-dist/loot-client-*.jar | head -1)
          echo "Release jar: $RELEASE_JAR"
          .github/verify-obfuscation.sh "$RELEASE_JAR"

      # Decompile our own shipped jar and report how readable it still is.
      # This is an honest "can it be cracked" check run against the real
      # obfuscated bytecode, not a guess. Never fails the build.
      - name: Self-crack analysis (decompile the obfuscated jar)
        continue-on-error: true
        run: |
          RELEASE_JAR=$(ls release-dist/loot-client-*.jar | head -1)
          echo "Decompiling: $RELEASE_JAR"
          curl -sSL -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          mkdir -p crack-out
          java -jar cfr.jar "$RELEASE_JAR" --outputdir crack-out --silent true >/dev/null 2>&1 || true
          CLIENT=crack-out/dev/loot/client
          echo "================= CRACK REPORT ================="
          TOTAL=$(find "$CLIENT" -name '*.java' 2>/dev/null | wc -l)
          echo "client .java files recovered by CFR : $TOTAL"
          echo
          echo "--- do local variable names survive? (expect only var0/var1...) ---"
          grep -rhoE '\b[a-z][a-zA-Z]{3,}[0-9]* =' "$CLIENT" 2>/dev/null | grep -vE '\bvar[0-9]' | head -5 || true
          echo "(var0-style auto names = debug info was stripped)"
          echo
          echo "--- plaintext string literals in OUR code (top 50 by frequency) ---"
          grep -rhoE '"[^"]{3,}"' "$CLIENT" 2>/dev/null | sort | uniq -c | sort -rn | head -50 || true
          echo
          echo "--- classes still carrying ORIGINAL readable names (kept rules) ---"
          echo "mixins (whole package kept by -keep):"
          find crack-out -path '*dev/loot/client/mixin/*' -name '*.java' 2>/dev/null | sed 's#.*/client/##' | head -40 || true
          echo
          echo "--- full decompiled sample: module.ModuleManager -> d.c ---"
          find crack-out -path '*dev/loot/client/d/c.java' -exec sed -n '1,90p' {} \; 2>/dev/null || true
          echo
          echo "--- full decompiled sample: a renamed module class d/b.java (Module base) ---"
          find crack-out -path '*dev/loot/client/d/b.java' -exec sed -n '1,60p' {} \; 2>/dev/null || true
          echo "=============== END CRACK REPORT ==============="

      # --- Artifacts ---
      - name: Upload debug jar
        uses: actions/upload-artifact@v4
        with:
          name: loot-client-debug
          path: debug-dist/loot-client-*.jar
          if-no-files-found: error

      - name: Upload obfuscated release jar
        uses: actions/upload-artifact@v4
        with:
          name: loot-client-release
          path: |
            release-dist/loot-client-*.jar
            release-dist/mapping.txt
          if-no-files-found: error
